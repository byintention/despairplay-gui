[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "despairplay"
dynamic = ["version"]
description = "Diagnose and repair Linux AirPlay (RAOP) sender setup."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Intention" }]
keywords = ["airplay", "raop", "pipewire", "avahi", "gtk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
# GTK/libadwaita come from distro GI packages, not pip.
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.16.4",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]

[project.scripts]
despairplay = "despairplay.__main__:main"

[tool.hatch.version]
path = "src/despairplay/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/data",
    "/docs",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/Makefile",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# gi.require_version() must run before gi.repository imports.
"src/despairplay/ui/gi_imports.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/despairplay"]
mypy_path = "src"
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["gi", "gi.repository.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jeepney", "jeepney.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["despairplay.ui.*"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: live Avahi/PipeWire/speakers (not run in CI)",
]
